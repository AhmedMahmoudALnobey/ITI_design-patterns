<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Toy Factory</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Create Toy</h2>
            <div class="grid gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Toy Type</label>
                    <select id="toyType" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
                        <option value="duck">Duck</option>
                        <option value="car">Car</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Color</label>
                    <input type="text" id="color" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" placeholder="e.g., Yellow">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Price ($)</label>
                    <input type="number" id="price" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" placeholder="e.g., 5.99" step="0.01">
                </div>
                <div id="carFields" class="hidden">
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" id="name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" placeholder="e.g., Speedster">
                </div>
                <button onclick="createToy()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Create Toy</button>
            </div>
            <p id="error" class="text-red-500 mt-2 hidden"></p>
        </div>

      
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Created Toys</h2>
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border p-2">Type</th>
                        <th class="border p-2">Color</th>
                        <th class="border p-2">Price</th>
                        <th class="border p-2">Name</th>
                    </tr>
                </thead>
                <tbody id="toyTable"></tbody>
            </table>
        </div>
    </div>  
    <script src="./task3.js"></script> 
</body>
</html>
